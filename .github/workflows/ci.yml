name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn verify:phase1
      - run: yarn verify:gepa
      - run: yarn verify:phase3
      - run: yarn verify:custom-goal
      - run: yarn verify:video
      - run: yarn verify:tournament
      - run: yarn verify:selfhosted
      - run: yarn verify:preference-gen
      - run: yarn export:samples
      # committed samples must be byte-identical to a fresh offline regeneration
      - run: git diff --exit-code -- exports/samples
      - run: yarn build
