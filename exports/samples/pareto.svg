<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Baseline vs evolved Pareto (relative cost vs val quality)">
  <rect width="640" height="360" fill="#f3f4f1"/>
  <text x="320" y="18" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#0c0e10">Evolve sample: relative cost % vs val quality</text>
  <line x1="56" y1="28" x2="56" y2="312" stroke="#9aa19a" stroke-width="1"/>
  <line x1="56" y1="312" x2="616" y2="312" stroke="#9aa19a" stroke-width="1"/>
  <line x1="56" y1="248.9" x2="616" y2="248.9" stroke="#1633c9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="612" y="242.9" text-anchor="end" font-size="11" fill="#1633c9">quality floor 0.50</text>
  <circle cx="616.0" cy="185.8" r="7" fill="#6b7280" /><text x="626.0" y="189.8" font-size="12" fill="#222">baseline</text>
<circle cx="406.0" cy="122.7" r="7" fill="#1633c9" /><text x="416.0" y="126.7" font-size="12" fill="#222">evolved</text>
  <text x="336" y="346" text-anchor="middle" font-size="12" fill="#555">Relative cost % of baseline (lower is cheaper)</text>
  <text x="16" y="170" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90 16 170)">Val quality</text>
</svg>
